<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT: ZERO - THE ENDBRINGER</title>
    <style>
        :root {
            --cyan-glow: #00ffff;
            --blood-red: #ff0000;
            --dark-blood: #880000;
            --sunset-orange: #ff5500;
            --void-purple: #7700ff;
            --safe-green: #00ffaa;
            --dark-matter: #050208;
            --shard-r: #ff2a00;
            --shard-g: #00ff55;
            --shard-b: #0088ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-matter);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: var(--cyan-glow);
            user-select: none;
        }

        canvas {
            display: block;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 999;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.4;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            position: absolute;
            padding: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        #health-hud {
            top: 20px;
            left: 20px;
        }

        .bar-container {
            width: 250px;
            height: 14px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--cyan-glow);
            margin-top: 5px;
            position: relative;
        }

        #hp-bar {
            height: 100%;
            width: 100%;
            background: var(--cyan-glow);
            transition: width 0.1s;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        #shield-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(255, 204, 0, 0.8);
            transition: width 0.1s;
            box-shadow: 0 0 10px #ffcc00;
        }
        
        .dash-container {
            width: 150px;
            height: 6px;
            background: rgba(255, 85, 0, 0.2);
            margin-top: 8px;
            border: 1px solid var(--sunset-orange);
        }

        #dash-bar {
            height: 100%;
            width: 100%;
            background: var(--sunset-orange);
            box-shadow: 0 0 8px var(--sunset-orange);
        }

        #active-buffs {
            margin-top: 10px;
            font-size: 14px;
            color: #ffcc00;
            text-shadow: 0 0 5px #ffcc00;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            width: 300px;
        }

        .buff-tag {
            padding: 2px 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            border: 1px solid currentColor;
        }

        #shards-hud {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .shard-icon {
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            transform: rotate(45deg);
            opacity: 0.3;
            transition: all 0.3s;
            box-shadow: none;
        }

        .shard-icon.active.r {
            border-color: var(--shard-r);
            background: var(--shard-r);
            opacity: 1;
            box-shadow: 0 0 10px var(--shard-r);
        }

        .shard-icon.active.g {
            border-color: var(--shard-g);
            background: var(--shard-g);
            opacity: 1;
            box-shadow: 0 0 10px var(--shard-g);
        }

        .shard-icon.active.b {
            border-color: var(--shard-b);
            background: var(--shard-b);
            opacity: 1;
            box-shadow: 0 0 10px var(--shard-b);
        }

        #skills-hud {
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-left: 4px solid var(--cyan-glow);
            border-radius: 4px;
        }

        .skill-item {
            margin-top: 10px;
            font-size: 16px;
            color: #fff;
        }

        .cd-text {
            font-family: monospace;
            font-size: 18px;
        }

        .s1 {
            color: var(--blood-red);
            text-shadow: 0 0 5px var(--blood-red);
        }

        .s2 {
            color: #ffcc00;
            text-shadow: 0 0 5px #ffcc00;
        }

        .s3 {
            color: var(--cyan-glow);
            text-shadow: 0 0 5px var(--cyan-glow);
        }

        #score-hud {
            top: 20px;
            right: 20px;
            font-size: 28px;
            text-align: right;
            color: #fff;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        #boss-hud {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            text-align: center;
            display: none;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        #boss-name {
            color: var(--blood-red);
            text-shadow: 0 0 15px var(--void-purple);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 12px;
            margin-bottom: 8px;
            transition: all 0.5s;
        }

        .boss-bar-bg {
            width: 100%;
            height: 20px;
            background: rgba(0,0,0,0.8);
            border: 3px solid var(--blood-red);
            box-shadow: 0 0 20px rgba(255,17,0,0.5);
            transition: all 0.5s;
        }

        #boss-hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--void-purple), var(--blood-red));
            transition: width 0.3s ease-out, background 0.5s;
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 8, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
        }

        h1 {
            font-size: 80px;
            color: var(--blood-red);
            text-shadow: 0 0 30px var(--sunset-orange);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .subtitle {
            color: var(--sunset-orange);
            letter-spacing: 12px;
            margin-bottom: 60px;
            font-size: 22px;
            text-shadow: 0 0 10px var(--sunset-orange);
            font-weight: bold;
        }
        
        .start-btn {
            background: transparent;
            border: 2px solid var(--blood-red);
            color: var(--blood-red);
            padding: 20px 60px;
            font-size: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            animation: pulse-btn 2s infinite;
            margin-bottom: 20px;
        }

        .start-btn:hover {
            background: var(--blood-red);
            color: #000;
            box-shadow: 0 0 50px var(--blood-red);
            animation: none;
            transform: scale(1.05);
        }

        .toggle-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--cyan-glow);
            color: var(--cyan-glow);
            padding: 10px 30px;
            font-size: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .toggle-btn.on {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 20px var(--cyan-glow);
        }
        
        @keyframes pulse-btn {
            0% { 
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); 
                text-shadow: 0 0 5px var(--blood-red); 
                transform: scale(1); 
            }
            50% { 
                box-shadow: 0 0 50px rgba(255, 0, 0, 0.6); 
                text-shadow: 0 0 20px var(--blood-red); 
                transform: scale(1.02); 
            }
            100% { 
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); 
                text-shadow: 0 0 5px var(--blood-red); 
                transform: scale(1); 
            }
        }

        .hint-text {
            position: absolute;
            bottom: 30px;
            color: #888;
            font-size: 14px;
            letter-spacing: 4px;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body class="crt">

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="health-hud" class="hud-panel">
        <div style="color: #fff;">SYS.INTEGRITY <span id="hp-val">100</span>%</div>
        <div class="bar-container">
            <div id="hp-bar"></div>
            <div id="shield-bar"></div>
        </div>
        <div style="font-size: 12px; margin-top: 10px; color: var(--sunset-orange);">THRUSTERS (SHIFT)</div>
        <div class="dash-container"><div id="dash-bar"></div></div>
        
        <div id="shards-hud">
            <span style="font-size:12px; color:#fff;">CORE:</span>
            <div id="ui-shard-r" class="shard-icon r"></div>
            <div id="ui-shard-g" class="shard-icon g"></div>
            <div id="ui-shard-b" class="shard-icon b"></div>
        </div>

        <div id="active-buffs"></div>
    </div>

    <div id="skills-hud" class="hud-panel">
        <div class="skill-item">[1] <span class="s1">ESCALATING CANNON (x30)</span> <span class="cd-text" id="cd1">READY</span></div>
        <div class="skill-item">[2] <span class="s2">AEGIS FORCEFIELD (5s)</span>   <span class="cd-text" id="cd2">READY</span></div>
        <div class="skill-item">[3] <span class="s3">TRINITY OBLITERATION</span>      <span class="cd-text" id="cd3">READY</span></div>
    </div>

    <div id="score-hud" class="hud-panel">
        DMG: <span id="score-val">0</span>
    </div>

    <div id="boss-hud">
        <div id="boss-name">THE ENDBRINGER</div>
        <div class="boss-bar-bg" id="boss-bar-bg"><div id="boss-hp-fill" style="width: 0%;"></div></div>
    </div>
</div>

<div id="menu-screen">
    <h1>THE TRUE VOID</h1>
    <div class="subtitle">ELDRITCH PROTOCOL</div>
    <button id="btn-autoaim" class="toggle-btn">AUTO-AIM: OFF</button>
    <button id="btn-start" class="start-btn">AWAKEN</button>
    <div class="hint-text">WASD: MOVE | W/S: AIM UP/DOWN | SHIFT: DASH | K: FIRE | 1-2-3: OVERRIDE</div>
</div>

<script>
/**
 * ENGINE SETUP & GLOBALS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw, ch;

function resize() { 
    cw = canvas.width = window.innerWidth; 
    ch = canvas.height = window.innerHeight; 
}
window.addEventListener('resize', resize); 
resize();

const gravity = 0.6;
let gameActive = false;
let frameCount = 0;
let score = 0;
let cameraShake = 0;
let screenFlash = 0; 
let screenSlice = 0; 

let autoAimEnabled = false;

// CAMERA SYSTEM
let cam = { targetOffsetX: 0, targetOffsetY: 0, zoom: 1, angle: 0, activeX: 0, activeY: 0, activeZoom: 1, activeAngle: 0 };

// ENTITIES & ARRAYS 
let player;
let entities = []; 
let bullets = []; 
let particles = []; 
let effects = []; 
let warningZones = []; 
let dropItems = [];
let mountainsLayer1 = []; 
let mountainsLayer2 = []; 
let snowParticles = [];

// SKILLS & CINEMATICS
const bossIntro = { active: false, timer: 0, maxTimer: 450 }; 
const bossEnrage = { active: false, timer: 0, maxTimer: 250 };
const bossDeath = { active: false, timer: 0, maxTimer: 450 }; // Kéo dài cutscene ngỏm
const bossUlt = { active: false, timer: 0, maxTimer: 100, type: 10 }; 
const cinematic = { active: false, timer: 0, maxTimer: 0, text: "", color: "", targetAngle: 0, dmgMult: 1, beams: [], nextBeamIdx: 0 };
const SKILL_COOLDOWNS = { 1: 0, 2: 0, 3: 0 };
const SKILL_MAX_CD = { 1: 480, 2: 480, 3: 900 }; // 480 frames = 8s

const Input = { keys: {} };
window.addEventListener('keydown', e => { 
    Input.keys[e.code] = true; 
    if(gameActive && player && !cinematic.active && !bossIntro.active && !bossUlt.active && !bossEnrage.active && !bossDeath.active) {
        if(e.code === 'Space') player.jump();
        if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.dash();
        if(e.code === 'Digit1') triggerSkill(1);
        if(e.code === 'Digit2') triggerSkill(2);
        if(e.code === 'Digit3') triggerSkill(3);
    }
});
window.addEventListener('keyup', e => Input.keys[e.code] = false);

const Utils = {
    dist: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y),
    rand: (min, max) => Math.random() * (max - min) + min,
    shake: (amount) => { cameraShake = Math.max(cameraShake, amount); },
    lerp: (start, end, amt) => (1 - amt) * start + amt * end,
    normalizeAngle: (angle) => {
        while (angle <= -Math.PI) angle += Math.PI * 2;
        while (angle > Math.PI) angle -= Math.PI * 2;
        return angle;
    },
    // Hàm làm mượt chuyển động (Ease Out Cubic)
    easeOutCubic: (x) => 1 - Math.pow(1 - x, 3)
};

function generateMountains() {
    mountainsLayer1 = []; mountainsLayer2 = [];
    let x = -cw; 
    while(x < cw*3) { mountainsLayer2.push({x: x, y: Utils.rand(ch - 300, ch - 150)}); x += Utils.rand(150, 300); }
    x = -cw; 
    while(x < cw*3) { mountainsLayer1.push({x: x, y: Utils.rand(ch - 200, ch - 80)}); x += Utils.rand(100, 250); }
}

/**
 * ITEM DROP SYSTEM
 */
const BUFF_TYPES = [
    { id: 'heal', color: '#00ff55', name: "REPAIR", type: 'buff', duration: 0 }, 
    { id: 'rapid', color: '#ffaa00', name: "RAPID FIRE", type: 'buff', duration: 300 }, 
    { id: 'speed', color: '#00ffff', name: "HASTE", type: 'buff', duration: 300 },
    { id: 'shard_r', color: '#ff2a00', name: "RUBY CORE", type: 'shard' },
    { id: 'shard_g', color: '#00ff55', name: "EMERALD CORE", type: 'shard' },
    { id: 'shard_b', color: '#0088ff', name: "SAPPHIRE CORE", type: 'shard' }
];

class DropItem {
    constructor(x, y) {
        this.x = x; 
        this.y = y; 
        this.vy = 0;
        this.data = BUFF_TYPES[Math.floor(Math.random() * BUFF_TYPES.length)];
        this.active = true; 
        this.life = 600; 
    }
    update() {
        if(cinematic.active || bossIntro.active || bossUlt.active || bossEnrage.active || bossDeath.active) return;
        this.vy += gravity * 0.5; 
        this.y += this.vy;
        if(this.y > ch - 45) { this.y = ch - 45; this.vy = 0; }
        this.life--; 
        if(this.life <= 0) this.active = false;
    }
    draw(ctx) {
        ctx.save(); 
        ctx.translate(this.x, this.y);
        ctx.globalAlpha = Math.min(1, this.life / 60); 
        let bob = Math.sin(frameCount * 0.1) * 5; 
        ctx.translate(0, bob);
        
        ctx.shadowBlur = 15; 
        ctx.shadowColor = this.data.color;
        ctx.fillStyle = '#111'; 
        ctx.strokeStyle = this.data.color; 
        ctx.lineWidth = 2;
        
        if (this.data.type === 'shard') {
            ctx.beginPath(); 
            ctx.moveTo(0, -12); 
            ctx.lineTo(10, 0); 
            ctx.lineTo(0, 12); 
            ctx.lineTo(-10, 0); 
            ctx.closePath();
            ctx.fill(); 
            ctx.stroke();
        } else {
            ctx.fillRect(-8, -8, 16, 16); 
            ctx.strokeRect(-8, -8, 16, 16);
        }
        
        ctx.fillStyle = this.data.color; 
        ctx.beginPath(); 
        ctx.arc(0, 0, 3, 0, Math.PI*2); 
        ctx.fill();
        ctx.restore();
    }
}

/**
 * DIRECTOR CAMERA & CINEMATICS
 */
function processDirectorCamera() {
    let boss = entities[0];
    
    if (bossIntro.active) {
        let t_i = bossIntro.maxTimer - bossIntro.timer;
        if (t_i < 150) { 
            cam.targetOffsetY = -300; 
            cam.zoom = 1.3; 
        } 
        else if (t_i < 300) { 
            cam.targetOffsetY = Utils.lerp(cam.targetOffsetY, -50, 0.05); 
            cam.zoom = Utils.lerp(cam.zoom, 1.5, 0.05); 
        } 
        else if (t_i < 380) {
            cam.targetOffsetX = (cw/2 - boss.x); 
            cam.targetOffsetY = (ch/2 - boss.y); 
            cam.zoom = Utils.lerp(cam.zoom, 3.5, 0.1); 
            if(frameCount%4===0) Utils.shake(5);
        } 
        else { 
            cam.targetOffsetX = 0; 
            cam.targetOffsetY = 0; 
            cam.zoom = Utils.lerp(cam.zoom, 1.0, 0.05); 
        }
    }
    else if (cinematic.active) {
        let t_c = 1 - (cinematic.timer / cinematic.maxTimer); 
        if (t_c < 0.6) { 
            cam.zoom = Utils.lerp(cam.zoom, 4.0, 0.1); 
            cam.targetOffsetX = (cw/2 - player.x) + player.facing*15; 
            cam.targetOffsetY = (ch/2 - player.y) + 160; 
            cam.angle = 0;
            if(frameCount%3===0) Utils.shake(2); 
        } else { 
            cam.zoom = Utils.lerp(cam.zoom, 0.9, 0.2); 
            cam.targetOffsetX = Utils.lerp(cam.targetOffsetX, 0, 0.2); 
            cam.targetOffsetY = Utils.lerp(cam.targetOffsetY, 0, 0.2); 
            cam.angle = (Math.random()-0.5)*0.05;
            Utils.shake(15); 
        }
    }
    else if (bossEnrage.active) {
        cam.zoom = Utils.lerp(cam.zoom, 3.5, 0.05);
        cam.targetOffsetX = (cw/2 - boss.x); 
        cam.targetOffsetY = (ch/2 - boss.y); 
    }
    else if (bossDeath.active) {
        cam.zoom = Utils.lerp(cam.zoom, 3.0, 0.02);
        cam.targetOffsetX = (cw/2 - boss.x); 
        cam.targetOffsetY = (ch/2 - boss.y); 
        if (frameCount%2===0) Utils.shake(10); 
    }
    else if (bossUlt.active && boss && !boss.isEnraged) {
        if (bossUlt.type === 10) { 
            cam.zoom = Utils.lerp(cam.zoom, 2.5, 0.05); 
            cam.targetOffsetX = (cw/2 - boss.x); 
            cam.targetOffsetY = (ch/2 - boss.y); 
        }
        else if (bossUlt.type === 11) { 
            cam.zoom = Utils.lerp(cam.zoom, 0.8, 0.05); 
            cam.targetOffsetX = (cw/2 - boss.x); 
            cam.targetOffsetY = (ch/2 - boss.y) + 100; 
        }
        else if (bossUlt.type === 12) {
            let t_u = 1 - (bossUlt.timer / bossUlt.maxTimer);
            cam.zoom = Utils.lerp(cam.zoom, 1.2 + Math.sin(t_u*20)*0.1, 0.05); 
            cam.angle = Math.sin(t_u*30)*0.05; 
            cam.targetOffsetX = (cw/2 - boss.x); 
            cam.targetOffsetY = (ch/2 - boss.y); 
        }
        else if (bossUlt.type === 13 || bossUlt.type === 14) {
            cam.zoom = Utils.lerp(cam.zoom, 1.5, 0.05); 
            cam.targetOffsetX = (cw/2 - boss.x); 
            cam.targetOffsetY = (ch/2 - boss.y);
        }
    }
    else {
        cam.targetOffsetX = (cw/2 - player.x) * 0.1; 
        cam.targetOffsetY = (ch/2 - player.y) * 0.1;
        cam.zoom = Utils.lerp(cam.zoom, 1, 0.05); 
        cam.angle = Utils.lerp(cam.angle, 0, 0.05);
    }

    cam.activeZoom = Utils.lerp(cam.activeZoom, cam.zoom, 0.1);
    cam.activeAngle = Utils.lerp(cam.activeAngle, cam.angle, 0.1);
    cam.activeX = Utils.lerp(cam.activeX, cam.targetOffsetX, 0.1);
    cam.activeY = Utils.lerp(cam.activeY, cam.targetOffsetY, 0.1);
}

function drawBossIntroOverlay() {
    let t = bossIntro.maxTimer - bossIntro.timer; 
    let boss = entities[0];
    
    ctx.save(); 
    ctx.setTransform(1,0,0,1,0,0);
    
    if (t < 150) {
        ctx.globalCompositeOperation = 'lighter';
        let crackAlpha = Math.min(1, t / 100);
        ctx.strokeStyle = `rgba(255, 17, 0, ${crackAlpha})`; 
        ctx.lineWidth = 15;
        ctx.shadowBlur = 50; 
        ctx.shadowColor = '#ff1100';
        ctx.beginPath();
        ctx.moveTo(cw/2 - 250, ch/2 - 500); 
        ctx.lineTo(cw/2 - 60, ch/2 - 300);
        ctx.lineTo(cw/2 + 100, ch/2 - 350); 
        ctx.lineTo(cw/2 + 300, ch/2 - 200); 
        ctx.stroke();

        snowParticles.forEach(p => { 
            p.x += (cw/2 - p.x) * 0.05; 
            p.y += (ch/2 - 350 - p.y) * 0.05; 
        });
        boss.y = -2000; 
        if(frameCount%10===0) Utils.shake(6);
    } 
    else if (t < 300) {
        // Fall down smoothly using easeOutCubic
        let fallT = (t - 150) / 150; 
        boss.x = cw/2; 
        boss.y = Utils.lerp(-800, 150, Utils.easeOutCubic(fallT)); 
        boss.auraPulse = Utils.lerp(0, 1, fallT);
        if(frameCount%5===0) Utils.shake(5);
    } 
    else if (t < 380) {
        ctx.fillStyle = `rgba(0,0,0,${Utils.lerp(0, 0.8, (t-300)/40)})`; 
        ctx.fillRect(0, 0, cw, ch);
        if (t === 379) { 
            Utils.shake(100); 
            screenFlash = 1.0; 
            snowParticles.forEach(p => { p.vx = (p.x - cw/2) * 0.2; p.vy = (p.y - boss.y) * 0.2; });
            spawnExplosion(boss.x, ch-40, '#ff1100', 150, 40); 
            effects.push({ type: 'text', text: "", x: cw/2, y: ch-40, life: 100, maxLife: 100, color: '#ff1100' });
            
            let hud = document.getElementById('boss-hud');
            hud.style.display = 'block';
            hud.style.opacity = '1';
        }
        
        boss.drawnHp = Utils.lerp(0, boss.maxHp, (t-300)/80);
        document.getElementById('boss-hp-fill').style.width = `${(boss.drawnHp/boss.maxHp)*100}%`;
    } 
    else {
        ctx.fillStyle = `rgba(0,0,0, ${Utils.lerp(0.8, 0, (t-380)/70)})`; 
        ctx.fillRect(0, 0, cw, ch);
        
        ctx.shadowBlur = 50; 
        ctx.shadowColor = '#ff1100'; 
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center'; 
        ctx.textBaseline = 'middle';
        let fontSize = 60 + (t - 380) * 0.4; 
        if(fontSize > 130) fontSize = 130;
        ctx.font = `bold ${fontSize}px "Courier New"`; 
        ctx.globalAlpha = Math.min(1, (t - 380) * 0.05);
        ctx.fillText("THE ENDBRINGER", cw/2 + (Math.random() - 0.5) * 10, ch/2 - 150);
        
        ctx.font = `24px "Courier New"`; 
        ctx.fillStyle = '#ffaa00';
        ctx.fillText("BEHOLD THE TRUE VOID", cw/2, ch/2 - 50);
        
        ctx.globalAlpha = 1; 
        ctx.shadowBlur = 0;
        
        boss.drawnHp = Utils.lerp(boss.drawnHp, boss.maxHp, 0.1);
        document.getElementById('boss-hp-fill').style.width = `${(boss.drawnHp/boss.maxHp)*100}%`;
    }
    ctx.restore();

    bossIntro.timer--;
    if (bossIntro.timer <= 0) {
        bossIntro.active = false; 
        boss.state = 'idle'; 
        boss.timer = 50;
    }
}
